<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>SWIPE — личный кабинет</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>
    <div id="auth-screen" class="auth-screen" hidden>
      <div class="auth-card">
        <div class="auth-brand"><span class="brand-mark"><i></i><i></i></span><strong>SWIPE</strong></div>
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-auth-tab="login">Вход</button>
          <button type="button" class="auth-tab" data-auth-tab="register">Регистрация</button>
        </div>
        <form id="login-form" class="auth-form">
          <label>Email<input name="email" type="email" required placeholder="you@example.com" autocomplete="username" /></label>
          <label>Пароль<input name="password" type="password" required minlength="6" placeholder="минимум 6 символов" autocomplete="current-password" /></label>
          <button class="primary-button" type="submit">Войти <span>→</span></button>
          <p class="auth-hint">Демо: alexey@example.com / demo1234 · валюта SC</p>
        </form>
        <form id="register-form" class="auth-form" hidden>
          <label>Имя<input name="name" type="text" required placeholder="Алексей К." autocomplete="name" /></label>
          <label>Email<input name="email" type="email" required placeholder="you@example.com" autocomplete="email" /></label>
          <label>Пароль<input name="password" type="password" required minlength="6" placeholder="минимум 6 символов" autocomplete="new-password" /></label>
          <button class="primary-button" type="submit">Создать аккаунт <span>→</span></button>
        </form>
      </div>
    </div>

    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="#overview" aria-label="SWIPE, главная">
          <span class="brand-mark"><i></i><i></i></span>
          <span>SWIPE</span>
        </a>
        <nav class="side-nav" aria-label="Основная навигация">
          <a class="nav-link active" href="#overview" data-nav="overview"><span class="nav-icon">⌘</span><span class="nav-text">Обзор</span></a>
          <a class="nav-link" href="#catalog" data-nav="catalog"><span class="nav-icon">▦</span><span class="nav-text">Карточки</span></a>
          <a class="nav-link" href="#withdrawals" data-nav="withdrawals"><span class="nav-icon">↗</span><span class="nav-text">Вывод средств</span></a>
          <a class="nav-link" href="#partners" data-nav="partners"><span class="nav-icon">◌</span><span class="nav-text">Партнёрская программа</span></a>
          <a class="nav-link" href="#bonuses" data-nav="bonuses"><span class="nav-icon">★</span><span class="nav-text">Бонусы</span></a>
          <a class="nav-link" href="#games" data-nav="games"><span class="nav-icon">◈</span><span class="nav-text">Игры</span></a>
          <a class="nav-link" href="#activity" data-nav="activity"><span class="nav-icon">≡</span><span class="nav-text">Операции</span></a>
          <a class="nav-link" href="#faq" data-nav="faq"><span class="nav-icon">?</span><span class="nav-text">FAQ</span></a>
          <a class="nav-link" href="#privacy" data-nav="privacy"><span class="nav-icon">§</span><span class="nav-text">Конфиденциальность</span></a>
          <a class="nav-link" href="#settings" data-nav="settings"><span class="nav-icon">⚙</span><span class="nav-text">Настройки</span></a>
        </nav>
        <div class="sidebar-footer">
          <button type="button" class="support-link" id="open-support"><span class="support-badge">?</span><span>Поддержка</span></button>
          <div class="profile" id="profile-block">
            <div class="avatar" id="sidebar-avatar">АК</div>
            <div><strong id="sidebar-name">Алексей К.</strong><small id="sidebar-status">Статус: Стандарт</small></div>
            <button class="more" id="profile-menu-btn" aria-label="Меню профиля" aria-expanded="false">•••</button>
            <div class="profile-menu" id="profile-menu" hidden>
              <button type="button" data-open-section="settings">Настройки</button>
              <button type="button" data-open-section="faq">FAQ</button>
              <button type="button" data-open-section="privacy">Политика</button>
              <button type="button" id="open-terms-btn">Условия сервиса</button>
              <button type="button" id="logout-btn" class="danger">Выйти</button>
            </div>
          </div>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <div class="mobile-brand">SWIPE</div>
          <div class="crumb"><span>Личный кабинет</span><b>/</b><strong id="page-title">Обзор</strong></div>
          <div class="top-actions">
            <div class="notify-wrap">
              <button class="icon-button" id="notify-btn" aria-label="Уведомления" aria-expanded="false"><span class="notification-dot" id="notify-dot" hidden></span>♧</button>
              <div class="notify-panel" id="notify-panel" hidden>
                <div class="notify-head"><strong>Уведомления</strong><button type="button" id="mark-all-read">Прочитать все</button></div>
                <div id="notify-list"></div>
              </div>
            </div>
            <button class="top-avatar" id="top-avatar" aria-label="Профиль">АК</button>
          </div>
        </header>

        <div class="content">
          <section class="page-section active" id="overview"></section>
          <section class="page-section" id="catalog"></section>
          <section class="page-section" id="withdrawals"></section>
          <section class="page-section" id="partners"></section>
          <section class="page-section" id="bonuses"></section>
          <section class="page-section" id="games"></section>
          <section class="page-section" id="activity"></section>
          <section class="page-section" id="faq"></section>
          <section class="page-section" id="privacy"></section>
          <section class="page-section" id="settings"></section>
        </div>
      </main>
    </div>

    <div class="modal-root" id="modal-root" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" type="button" data-close-modal aria-label="Закрыть">×</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
